type: go

ingress: true

health_check_path: "/api/health"

env:
  - name: APP_LOCALE
    value: en
  - name: APP_DEBUG
    value: "true"
  - name: APP_ENV
    value: development
  - name: BASE_URL
    value: https://api.uat.adenzo.co.ke
  - name: ENVIRONMENT
    value: development
  - name: PORT
    value: 8080
  - name: V2_URL
    value: http://api-v2.communications.svc.cluster.local:8080
  - name: DB_NAME
    value: adenzo
  - name: SHORTCODE
    value: Emalify
  - name: REDIS_HOST
    value: localhost
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    value: ""

secrets:
  - MPESA_CONSUMER_KEY
  - MPESA_CONSUMER_SECRET
  - MPESA_SHORTCODE
  - MPESA_PASSKEY
  - MPESA_CALLBACK_URL
  - MPESA_SEND_URL
  - JWT_SECRET
  - APIKEY
  - PARTNERID
  - SENDER_EMAIL
  - SERVICE_ACCOUNT
  

requires:
  - mysql
  - redis

migration_type: custom
migration_command: ["/app/app", "-migrate=true"]
migration_image_suffix: cli

