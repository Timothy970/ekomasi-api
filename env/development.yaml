type: go

ingress: true

health_check_path: "/api/health"

env:
  - name: APP_LOCALE
    value: en
  - name: APP_DEBUG
    value: "true"
  - name: APP_ENV
    value: development
  - name: BASE_URL
    value: https://api.ecom.development.roamtech.whitemire-technologies.com/api/
  - name: FRONT_END_BASE_URL
    value: https://adenzo-app.ecom.development.roamtech.whitemire-technologies.com/
  - name: ENVIRONMENT
    value: development
  - name: PORT
    value: 8080
  - name: V2_URL
    value: https://api.v2.emalify.com/api
  - name: DB_NAME
    value: adenzo
  - name: SHORTCODE
    value: Emalify
  - name: BUCKET_NAME
    value: development-ecommerce-public-api-images

secrets:
  - MPESA_CONSUMER_KEY
  - MPESA_CONSUMER_SECRET
  - MPESA_SHORTCODE
  - MPESA_HEAD_OFFICE
  - MPESA_PASSKEY
  - MPESA_CALLBACK_URL
  - MPESA_RETURN_URL
  - MPESA_STATUS_URL
  - MPESA_SEND_URL
  - JWT_SECRET
  - APIKEY
  - PARTNERID
  - SENDER_EMAIL
  # - SERVICE_ACCOUNT
  - SMSAPIKEY
  - SMSPARTNERID
  

requires:
  - mysql
  - redis

migration_type: custom
migration_command: ["/app/app", "-migrate=true"]
migration_image_suffix: cli

gcs_buckets_public:
  - images

allowed_networks:
  safaricom_1:
    - "196.201.214.200/32"
    - "196.201.214.206/32"
    - "196.201.213.114/32"
    - "196.201.214.207/32"
    - "196.201.214.208/32"
    - "196.201.213.44/32"
  safaricom_2:
    - "196.201.212.127/32"
    - "196.201.212.138/32"
    - "196.201.212.129/32"
    - "196.201.212.136/32"
    - "196.201.212.74/32"
    - "196.201.212.69/32"
