type: go

ingress: true

health_check_path: "/api/health"

allowed_networks:
  adenzo:
    - 197.248.216.187/32
    - 197.254.97.46/32

env:
  - name: APP_LOCALE
    value: en
  - name: APP_DEBUG
    value: "true"
  - name: APP_ENV
    value: development
  - name: BASE_URL
    value: https://api.ecom.staging.roamtech.whitemire-technologies.com/api/
  - name: ENVIRONMENT
    value: staging
  - name: PORT
    value: 8080
  - name: V2_URL
    value: https://api.v2.emalify.com/api
  - name: DB_NAME
    value: adenzo
  - name: SHORTCODE
    value: Emalify

secrets:
  - MPESA_CONSUMER_KEY
  - MPESA_CONSUMER_SECRET
  - MPESA_SHORTCODE
  - MPESA_PASSKEY
  - MPESA_CALLBACK_URL
  - MPESA_SEND_URL
  - JWT_SECRET
  - APIKEY
  - PARTNERID
  - SENDER_EMAIL
  # - SERVICE_ACCOUNT
  - SMSAPIKEY
  - SMSPARTNERID
  - BUCKET_NAME
  

requires:
  - mysql
  - redis

migration_type: custom
migration_command: ["/app/app", "-migrate=true"]
migration_image_suffix: cli

gcs_buckets:
  - images
