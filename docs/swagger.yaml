definitions:
  dtos.AddChargeToProductRequest:
    properties:
      charge_id:
        type: string
      product_id:
        type: string
    required:
    - charge_id
    - product_id
    type: object
  dtos.AddProductWarrantiesRequest:
    properties:
      expiry_date:
        type: string
      manufacturing_date:
        type: string
      product_id:
        type: string
      warranty_period:
        description: in months
        minimum: 1
        type: integer
      warranty_type_id:
        type: string
    required:
    - product_id
    - warranty_period
    - warranty_type_id
    type: object
  dtos.AddProductsToBundle:
    properties:
      bundle_id:
        type: string
      product_ids:
        items:
          type: string
        type: array
    required:
    - bundle_id
    - product_ids
    type: object
  dtos.AddPromotionToProductRequest:
    properties:
      product_id:
        type: string
      promotion_type_id:
        type: string
    required:
    - product_id
    - promotion_type_id
    type: object
  dtos.AddToCartRequest:
    properties:
      cart_id:
        type: string
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
      variation_sku:
        type: string
    required:
    - cart_id
    - product_id
    - quantity
    type: object
  dtos.AddToCartResponse:
    properties:
      message:
        type: string
    type: object
  dtos.AdminDeleteUserAddress:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  dtos.AdminUserAddress:
    properties:
      address:
        type: string
      apartment:
        type: string
      city:
        type: string
      country:
        type: string
      user_id:
        type: string
      zip_code:
        type: string
    required:
    - address
    - apartment
    - city
    - country
    - user_id
    - zip_code
    type: object
  dtos.AttachProductToPromotion:
    properties:
      product_ids:
        items:
          type: string
        type: array
      promotion_id:
        type: string
    type: object
  dtos.AutoCompleteResponse:
    properties:
      suggestions:
        items:
          $ref: '#/definitions/dtos.AutoCompleteResult'
        type: array
      total:
        type: integer
    type: object
  dtos.AutoCompleteResult:
    properties:
      display_name:
        type: string
      id:
        type: string
      image_url:
        type: string
      link:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  dtos.AvailablePermission:
    properties:
      category:
        type: string
      description:
        type: string
      key:
        type: string
    required:
    - category
    - description
    - key
    type: object
  dtos.BalanceSheetAccount:
    properties:
      account_code:
        type: string
      account_id:
        type: string
      account_name:
        type: string
      balance:
        type: number
      change:
        type: number
      change_percent:
        type: number
      previous_balance:
        type: number
    type: object
  dtos.BalanceSheetCategory:
    properties:
      accounts:
        items:
          $ref: '#/definitions/dtos.BalanceSheetAccount'
        type: array
      category:
        type: string
      change:
        type: number
      change_percent:
        type: number
      previous_total:
        type: number
      total:
        type: number
    type: object
  dtos.BalanceSheetResponse:
    properties:
      as_of:
        type: string
      balance_check:
        type: number
      compare_with:
        type: string
      sections:
        items:
          $ref: '#/definitions/dtos.BalanceSheetSection'
        type: array
    type: object
  dtos.BalanceSheetSection:
    properties:
      categories:
        items:
          $ref: '#/definitions/dtos.BalanceSheetCategory'
        type: array
      change:
        type: number
      change_percent:
        type: number
      previous_total:
        type: number
      section_name:
        description: '"Assets", "Liabilities", "Equity"'
        type: string
      total:
        type: number
    type: object
  dtos.Blog:
    properties:
      author:
        type: string
      author_id:
        type: string
      blog_id:
        type: string
      content:
        type: string
      image_url:
        type: string
      is_published:
        type: boolean
      published_at:
        type: string
      title:
        type: string
    required:
    - author
    - content
    - title
    type: object
  dtos.BlogBanner:
    additionalProperties: {}
    type: object
  dtos.BlogImage:
    additionalProperties: {}
    type: object
  dtos.BlogRequest:
    properties:
      author:
        additionalProperties: {}
        description: "Author      struct {\n\tName   string  `json:\"name\" validate:\"required\"`\n\tAvatar
          *string `json:\"avatar\"`\n} `json:\"author\"`"
        type: object
      author_id:
        type: string
      banner_image_url:
        type: string
      blog_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_published:
        type: boolean
      published_at:
        type: string
      read_time_minutes:
        type: integer
      sections:
        items:
          properties:
            banner:
              allOf:
              - $ref: '#/definitions/dtos.BlogBanner'
              description: Pointer allows null values
            images:
              items:
                $ref: '#/definitions/dtos.BlogImage'
              type: array
            paragraphs:
              items:
                $ref: '#/definitions/dtos.Paragraph'
              type: array
            position:
              type: integer
          required:
          - position
          type: object
        type: array
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    required:
    - read_time_minutes
    - title
    type: object
  dtos.BulkImportDiagnosticResult:
    properties:
      created_skus:
        items:
          type: string
        type: array
      errors:
        items:
          $ref: '#/definitions/dtos.BulkValidationRowError'
        type: array
      invalid_rows_count:
        type: integer
      mode:
        type: string
      processed_count:
        type: integer
      total_rows:
        type: integer
      updated_skus:
        items:
          type: string
        type: array
      valid_rows_count:
        type: integer
      validate_only:
        type: boolean
    type: object
  dtos.BulkValidationRowError:
    properties:
      error_message:
        type: string
      field:
        type: string
      product_name:
        type: string
      row_number:
        type: integer
      sku:
        type: string
      value:
        type: string
    type: object
  dtos.BundleProducts:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  dtos.BuyVoucherData:
    properties:
      amount:
        type: number
      delivery_time:
        type: string
      design_id:
        type: string
      from_name:
        type: string
      message:
        type: string
      payment_method:
        type: string
      phone_number:
        type: string
      to_email:
        type: string
      to_name:
        type: string
    required:
    - amount
    - delivery_time
    - design_id
    - from_name
    - to_email
    - to_name
    type: object
  dtos.CartItem:
    properties:
      is_variant:
        type: boolean
      product:
        $ref: '#/definitions/dtos.Product'
      quantity:
        type: integer
      variation_sku:
        type: string
    type: object
  dtos.CashFlowRequest:
    properties:
      cash_account_ids:
        description: which accounts are “cash”
        items:
          type: string
        type: array
      from:
        description: YYYY-MM-DD
        type: string
      to:
        description: YYYY-MM-DD
        type: string
    required:
    - cash_account_ids
    - from
    - to
    type: object
  dtos.CashFlowResponse:
    properties:
      beginning_cash:
        description: 'Optional: Ending cash of those accounts over the period'
        type: number
      ending_cash:
        type: number
      from:
        type: string
      net_change:
        type: number
      to:
        type: string
      total_inflows:
        type: number
      total_outflows:
        type: number
    type: object
  dtos.CashPayment:
    properties:
      amount:
        type: number
      order_id:
        type: string
    required:
    - amount
    - order_id
    type: object
  dtos.Category:
    properties:
      category_id:
        type: string
      description:
        type: string
      image_url:
        type: string
      name:
        type: string
      parent_category_id:
        type: string
    type: object
  dtos.CategoryData:
    properties:
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      parent_category_id:
        type: string
      products:
        items:
          $ref: '#/definitions/dtos.ProductData'
        type: array
      subcategories:
        items:
          $ref: '#/definitions/dtos.CategoryData'
        type: array
    type: object
  dtos.Change:
    properties:
      field:
        type: string
      value:
        $ref: '#/definitions/dtos.Value'
    type: object
  dtos.Charge:
    properties:
      charge_id:
        type: string
      charge_name:
        type: string
      charge_value:
        type: number
    required:
    - charge_name
    - charge_value
    type: object
  dtos.Contact:
