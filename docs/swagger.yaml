  dtos.CreateAccountRequest:
    properties:
      account_code:
        description: Optional - if not provided, will be auto-generated
        type: string
      account_name:
        type: string
      account_type:
        type: string
      category:
        type: string
      description:
        type: string
      statement_type:
        type: string
      status:
        enum:
        - active
        - archived
        type: string
    required:
    - account_name
    - account_type
    - category
    - statement_type
    - status
    type: object
  dtos.CreateCartRequest:
