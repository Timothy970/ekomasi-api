definitions:
  dtos.AddToCartRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  dtos.AddToCartResponse:
    properties:
      message:
        type: string
    type: object
  dtos.CartItem:
    properties:
      price:
        type: number
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
    type: object
  dtos.Category:
    properties:
      category_id:
        type: string
      description:
        type: string
      name:
        type: string
      parent_category_id:
        type: string
    type: object
  dtos.CouponRequest:
    properties:
      coupon_code:
        type: string
    type: object
  dtos.CreateCategory:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  dtos.CreateProduct:
    properties:
      category_id:
        type: string
      description:
        type: string
      name:
        type: string
      price:
        type: number
      product_id:
        type: string
      search_vector:
        type: string
      sku:
        type: string
      stock_quantity:
        minimum: 0
        type: integer
    required:
    - category_id
    - description
    - name
    - price
    - search_vector
    - sku
    - stock_quantity
    type: object
  dtos.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dtos.GenericResponse:
    properties:
      message:
        type: string
    type: object
  dtos.OrderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
      unit_price:
        type: number
      variant_id:
        type: string
    type: object
  dtos.OrderRequest:
    properties:
      courier_details:
        type: string
      delivery_charge:
        type: number
      guest_delivery_address:
        type: string
      guest_notification_channel:
        type: integer
      guest_notification_details:
        type: string
      is_guest_order:
        type: boolean
      order_items:
        items:
          $ref: '#/definitions/dtos.OrderItemRequest'
        type: array
      user_id:
        type: string
    type: object
  dtos.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone_number:
        type: string
      role:
        type: string
    type: object
  dtos.RegisterResponse:
    properties:
      message:
        type: string
      token:
        additionalProperties: true
        type: object
      user:
        description: Replace `interface{}` with your actual user struct if available
    type: object
  dtos.RemoveFromCartRequest:
    properties:
      product_id:
        type: string
    type: object
  dtos.RemoveFromCartResponse:
    properties:
      message:
        type: string
    type: object
  dtos.ReviewRequest:
    properties:
      details:
        type: string
      score:
        type: integer
      user_id:
        type: string
    required:
    - details
    - score
    - user_id
    type: object
  dtos.ReviewResponse:
    properties:
      created_at:
        type: string
      details:
        type: string
      product_id:
        type: string
      review_id:
        type: string
      score:
        type: integer
      user_id:
        type: string
    type: object
  dtos.UpdateCartItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  dtos.UpdateCartItemResponse:
    properties:
      message:
        type: string
    type: object
  dtos.UpdateOrderStatusRequest:
    properties:
      status:
        type: string
    type: object
  dtos.VerifyOTP:
    properties:
      email:
        type: string
      otp:
        type: string
      phone_number:
        type: string
    type: object
  dtos.ViewCartResponse:
    properties:
      cart_items:
        items:
          $ref: '#/definitions/dtos.CartItem'
        type: array
      discount:
        type: number
      final:
        type: number
      total:
        type: number
    type: object
  dtos.Wishlist:
    properties:
      is_public:
        type: boolean
      name:
        type: string
      wishlist_id:
        type: string
    type: object
  dtos.WishlistItem:
    properties:
      product_id:
        type: string
    required:
    - product_id
    type: object
info:
